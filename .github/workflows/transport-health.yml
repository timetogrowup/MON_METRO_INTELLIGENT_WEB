name: Surveiller les horaires transport en production
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  push:
    branches: [main]
    paths: ['monitoring/**', 'transport-health.js', '.github/workflows/transport-health.yml']
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: transport-production-health
  cancel-in-progress: false
jobs:
  production-health:
    if: github.repository == 'timetogrowup/WENARE' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: |
            monitoring
            transport-health.js
            /distribution/manifest.json
            /distribution/timetable/manifest.json
            /distribution/mobility/manifest.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les seuils de surveillance
        run: |
          python -m unittest discover -s monitoring -p 'test_*.py' -v
          node monitoring/test_transport_health.cjs
      - name: Contrôler les horaires réellement publiés
        id: health
        continue-on-error: true
        env:
          POST_DEPLOYMENT: ${{ github.event_name == 'workflow_run' }}
        run: |
          if [ "$POST_DEPLOYMENT" = "true" ]; then
            python monitoring/check_transport_health.py --deep --expected-root distribution --attempts 3 --delay 20
          else
            python monitoring/check_transport_health.py --deep
          fi
      - name: Ouvrir ou résoudre l'alerte de production
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const title='[WENARE] Validité des horaires de transport';
            const report=fs.existsSync('transport-health.json')?JSON.parse(fs.readFileSync('transport-health.json','utf8')):{healthy:false,error:'Le contrôle ne produit aucun résultat. Consulter cette exécution.'};
            const issues=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',creator:'github-actions[bot]',per_page:100});
            const existing=issues.find(i=>!i.pull_request&&i.title===title);
            const run=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if(!report.healthy){
              const body='Contrôle indépendant du site WENARE publié. Préalerte à moins de 18 heures de validité, ou incident si données expirées, invalides ou inaccessibles.\n\n```json\n'+JSON.stringify(report,null,2)+'\n```\n\nExécution : '+run;
              if(existing)await github.rest.issues.update({...context.repo,issue_number:existing.number,body});
              else await github.rest.issues.create({...context.repo,title,body});
            }else if(existing){
              await github.rest.issues.createComment({...context.repo,issue_number:existing.number,body:'Rétablissement vérifié sur le site publié : les deux jeux ont au moins 18 heures de validité. '+run});
              await github.rest.issues.update({...context.repo,issue_number:existing.number,state:'closed',state_reason:'completed'});
            }
      - name: Récupération contrôlée avant expiration
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const report=fs.existsSync('transport-health.json')?JSON.parse(fs.readFileSync('transport-health.json','utf8')):null;
            const {data}=await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'refresh-bus-idf-public.yml',per_page:10});
            const runs=data.workflow_runs;
            const active=runs.filter(r=>['queued','in_progress','waiting','pending','requested'].includes(r.status));
            // A queue stuck for hours must not suppress recovery indefinitely.
            if(active.some(r=>r.status!=='queued'||Date.now()-Date.parse(r.created_at)<2*3600000)){core.info('Actualisation déjà en cours');return;}
            for(const run of active){
              await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:run.id});
              core.warning('Ancienne actualisation bloquée en attente annulée : '+run.id);
            }
            const last=runs[0];
            const failed=last&&last.conclusion!=='success';
            const degraded=report&&!report.healthy&&report.datasets.some(d=>d.state!=='healthy'&&d.state!=='unreachable');
            if(!failed&&!degraded)return;
            if(last&&Date.now()-Date.parse(last.created_at)<6*3600000){core.info('Délai de récupération de six heures actif');return;}
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'refresh-bus-idf-public.yml',ref:'main'});
            core.notice('Actualisation des horaires relancée avec tous les contrôles de qualité');
      - name: Conserver le résultat dans le résumé
        if: always()
        run: |
          if [ -f transport-health.json ]; then
            cat transport-health.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Signaler un état dégradé
        if: steps.health.outcome != 'success'
        run: exit 1
