name: Débloquer les anciennes actualisations WENARE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/unblock-transport.yml']
permissions:
  actions: write
jobs:
  unblock:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Arrêter uniquement les anciennes exécutions identifiées
        uses: actions/github-script@v7
        with:
          script: |
            const targets=context.repo.repo==='WENARE'?[43094195983]:[43094170707,43095456745];
            for(const run_id of targets){
              const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id});
              if(run.status==='completed'){core.info('Déjà terminé : '+run_id);continue;}
              try{
                if(run.status==='queued')await github.rest.actions.cancelWorkflowRun({...context.repo,run_id});
                else await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel',{...context.repo,run_id});
                core.notice('Arrêt demandé : '+run_id);
              }catch(error){if(error.status===409){core.info('État déjà modifié : '+run_id);}else throw error;}
            }
