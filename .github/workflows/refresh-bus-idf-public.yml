name: Qualifier et actualiser les bus IDFM publics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'monitoring/validate_transport_reserve.py', '.github/workflows/refresh-bus-idf-public.yml']
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: public-idfm-qualified-data
  cancel-in-progress: true
jobs:
  qualify-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Jour de service
        id: day
        run: echo "value=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: public-idfm-gtfs-${{ runner.os }}-${{ steps.day.outputs.value }}
      - name: Générer et contrôler les données officielles
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then return 1; fi
              sleep "$((attempt * 30))"
              attempt=$((attempt + 1))
            done
          }
          retry python scripts/fetch_rail_segments.py
          python scripts/filter_metro_segments.py
          python scripts/validate_reference.py
          retry python scripts/fetch_stations.py
          retry python scripts/build_gtfs.py
          python scripts/validate_gtfs.py
          python scripts/build_master.py
          python scripts/compare_sources.py
          python scripts/match_shapes.py
          python scripts/build_distribution.py
          python scripts/validate_publication.py
          python scripts/build_timetable.py
          python scripts/validate_timetable.py
          retry python scripts/build_bus_network.py
          python scripts/validate_mobility.py
          python monitoring/validate_transport_reserve.py
      - name: Tests de non-régression
        run: |
          python -m unittest discover -s tests -v
          node tests/test_network.cjs
          node tests/test_journey.cjs
          node tests/test_replay.cjs
          node --test tests/test_departures.cjs tests/test_timetable.cjs tests/test_mobility.cjs tests/test_nearby.cjs tests/test_transport_modes.cjs
      - name: Résumer la qualification sans service d'archivage
        run: |
          echo '## Qualification des horaires' >> "$GITHUB_STEP_SUMMARY"
          echo 'Contrôles de données et tests de non-régression réussis. Les manifestes qualifiés accompagnent les fichiers publiés dans le dépôt.' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit atomique des seules données qualifiées
        id: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/
          if ! git diff --cached --quiet; then
            git commit -m "data: actualiser les horaires qualifiés de tous les bus IDFM"
            git pull --rebase origin main
          git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconstruire le site avec les horaires qualifiés
        if: steps.data.outputs.changed == 'true' && github.repository == 'timetogrowup/WENARE'
        uses: actions/github-script@v7
        with:
          script: await github.rest.repos.requestPagesBuild({...context.repo});
      - name: Vérifier le site après publication des horaires
        if: steps.data.outputs.changed == 'true' && github.repository == 'timetogrowup/WENARE'
        run: python monitoring/check_transport_health.py --deep --expected-root distribution --attempts 8 --delay 20
      - name: Résumer le contrôle après publication
        if: always()
        run: |
          if [ -f transport-health.json ]; then
            echo '## Contrôle du site publié' >> "$GITHUB_STEP_SUMMARY"
            cat transport-health.json >> "$GITHUB_STEP_SUMMARY"
          fi
