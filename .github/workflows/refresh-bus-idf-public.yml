name: Qualifier et actualiser les bus IDFM publics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'monitoring/validate_transport_reserve.py', 'release-client/**', '.github/workflows/refresh-bus-idf-public.yml']
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: public-idfm-qualified-data
  cancel-in-progress: true
jobs:
  qualify-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Jour de service
        id: day
        run: echo "value=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: public-idfm-gtfs-${{ runner.os }}-${{ steps.day.outputs.value }}
      - name: Préparer la migration initiale sans activer le client en ligne
        id: migration
        run: |
          python - <<'PYTHON'
          import json,os,pathlib,shutil
          m=json.loads(pathlib.Path('distribution/mobility/manifest.json').read_text())
          initial=m.get('catalogueVersion')!=3 or m.get('directionVersion')!=1
          if initial:
              for p in pathlib.Path('release-client').iterdir():
                  if p.is_file():shutil.copyfile(p,pathlib.Path(p.name))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('initial='+str(initial).lower()+'\n')
          PYTHON
      - name: Générer et contrôler les données officielles
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then return 1; fi
              sleep "$((attempt * 30))"
              attempt=$((attempt + 1))
            done
          }
          retry python scripts/fetch_rail_segments.py
          python scripts/filter_metro_segments.py
          python scripts/validate_reference.py
          retry python scripts/fetch_stations.py
          retry python scripts/build_gtfs.py
          python scripts/validate_gtfs.py
          python scripts/build_master.py
          python scripts/compare_sources.py
          python scripts/match_shapes.py
          python scripts/build_distribution.py
          python scripts/validate_publication.py
          python scripts/build_timetable.py
          python scripts/validate_timetable.py
          retry python scripts/build_bus_network.py
          python scripts/validate_mobility.py
          python monitoring/validate_transport_reserve.py
      - name: Tests de non-régression
        run: |
          python -m unittest discover -s tests -v
          node tests/test_network.cjs
          node tests/test_journey.cjs
          node tests/test_replay.cjs
          node --test tests/test_departures.cjs tests/test_timetable.cjs tests/test_mobility.cjs tests/test_nearby.cjs
      - name: Conserver les preuves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-bus-idf-${{ github.run_id }}
          path: |
            distribution/manifest.json
            distribution/timetable/manifest.json
            distribution/mobility/manifest.json
          retention-days: 14
      - name: Commit atomique des seules données qualifiées
        id: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/
          if [ "${{ steps.migration.outputs.initial }}" = "true" ]; then
            git add index.html sw.js mobility.js departures.js departures-ui.js nearby-ui.js nearby.js timetable.js
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: actualiser les horaires qualifiés de tous les bus IDFM"
            git pull --rebase origin main
          git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconstruire le site avec les horaires qualifiés
        if: steps.data.outputs.changed == 'true' && github.repository == 'timetogrowup/WENARE'
        uses: actions/github-script@v7
        with:
          script: await github.rest.repos.requestPagesBuild({...context.repo});
